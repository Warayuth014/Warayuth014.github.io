[vars]
REPO = "Warayuth014/Warayuth014.github.io"
BRANCH = "main"
ALLOWED_ORIGINS = "https://warayuth014.github.io"

# Secrets (set with `npx wrangler secret put`, never written here): GITHUB_TOKEN, SESSION_SECRET

